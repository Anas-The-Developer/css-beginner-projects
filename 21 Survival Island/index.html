<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survival Island</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="island">

        <header class="header">

            <div>
                <h1>🏝️ SURVIVAL ISLAND</h1>
                <p>LOST BUT ALIVE</p>
            </div>

            <div class="day">
                <h2>DAY 7</h2>
            </div>

        </header>


        <section class="main-area">

            <div class="camp">

                <div class="tent">
                    ⛺
                </div>

                <h2>CAMP SITE</h2>

                <p>🔥 Fire: ACTIVE</p>

            </div>


            <div class="map">

                <h2>🗺️ MAP</h2>

                <div class="island-map">
                    🌴
                    🌊
                    📍
                    🌊
                    🌴
                </div>

            </div>

        </section>


        <section class="supplies">

            <h2>SURVIVAL SUPPLIES</h2>

            <div class="supply-list">

                <div class="supply">
                    <div class="supply-icon">💧</div>
                    <h3>WATER</h3>
                    <p>72%</p>
                </div>

                <div class="supply">
                    <div class="supply-icon">🍎</div>
                    <h3>FOOD</h3>
                    <p>45%</p>
                </div>

                <div class="supply">
                    <div class="supply-icon">🪵</div>
                    <h3>WOOD</h3>
                    <p>88%</p>
                </div>

            </div>

        </section>


        <section class="emergency">

            <h2>🚨 EMERGENCY SIGNAL</h2>

            <button>SEND SIGNAL</button>

        </section>


        <footer class="footer">

            <span>🟢 CAMP SECURE</span>

            <span>🌙 NIGHT</span>

        </footer>

    </div>

</body>
</html>
