<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Property Practice</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Display Property Practice</h1>

    <section>
        <h2>Block Elements</h2>

        <div class="block-box">Block 1</div>
        <div class="block-box">Block 2</div>
        <div class="block-box">Block 3</div>
    </section>

    <section>
        <h2>Inline Elements</h2>

        <span class="inline-box">Inline 1</span>
        <span class="inline-box">Inline 2</span>
        <span class="inline-box">Inline 3</span>
    </section>

    <section>
        <h2>Inline-Block Elements</h2>

        <div class="inline-block-box">Box 1</div>
        <div class="inline-block-box">Box 2</div>
        <div class="inline-block-box">Box 3</div>
    </section>

</body>
</html>
