<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Pit Stop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="pit-stop">

        <header class="header">
            <h1>🏎️ RACING PIT STOP</h1>
            <p>TEAM: SPEED FORCE</p>
        </header>

        <div class="race-info">
            <div>
                <h2>GRAND PRIX</h2>
                <p>Lap 42 / 60</p>
            </div>

            <div>
                <h2>POSITION</h2>
                <p>🥈 2nd</p>
            </div>

            <div>
                <h2>TIME</h2>
                <p>01:24:36</p>
            </div>
        </div>

        <section class="car-area">

            <div class="car">
                🏎️
            </div>

            <div class="car-details">
                <h2>CAR #27</h2>
                <p>Driver: Alex</p>
                <p class="second-para">Speed: 312 km/h</p>
            </div>

        </section>

        <section class="pit-team">

            <h2>PIT CREW</h2>

            <div class="crew">

                <div class="member">
                    <div class="icon">🔧</div>
                    <h3>MECHANIC</h3>
                    <p>Ready</p>
                </div>

                <div class="member">
                    <div class="icon">🛞</div>
                    <h3>TYRE TEAM</h3>
                    <p>Ready</p>
                </div>

                <div class="member">
                    <div class="icon">⛽</div>
                    <h3>FUEL TEAM</h3>
                    <p>Ready</p>
                </div>

                <div class="member">
                    <div class="icon">📡</div>
                    <h3>RADIO</h3>
                    <p>Online</p>
                </div>

            </div>

        </section>

        <footer class="footer">
            <span>🟢 PIT STOP READY</span>
            <span>⚡ NEXT STOP: LAP 50</span>
        </footer>

    </div>

</body>
</html>
