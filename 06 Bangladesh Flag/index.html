<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bangladesh Flag</title>

    <style>
        .flag {
            width: 900px;
            height: 600px;
            background-color: darkgreen;
            position: relative;
        }

        .flag > div {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            position: absolute;
            top: 200px;
            left: 325px;
            background-color: red;
        }

        div p {
            font-family: 'Times New Roman', Times, serif;
            font-size: 2rem;
            position: absolute;
            top: 50px;
            left: 25px;
            
        }
    </style>
</head>

<body>

    <div class="flag">
        <div>
            <p>Bangladesh</p>
        </div>
    </div>

</body>

</html>
