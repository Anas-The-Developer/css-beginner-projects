<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag of France</title>

    <style>
        .flag {
            width: 900px;
            height: 600px;
            background-color: red;
            position: relative;
        }

        .flag > div:nth-child(1) {
            width: 300px;
            height: 600px;
            position: absolute;
            background-color: darkblue;
            left: 0;
            
        }

        .flag > div:nth-child(2) {
            width: 300px;
            height: 600px;
            position: absolute;
            background-color: white;
            left: 300px;
            
        }

        
        
    </style>
</head>

<body>

    <div class="flag">
        <div></div>
        <div></div>
        <div></div>
    </div>

</body>
</html>
