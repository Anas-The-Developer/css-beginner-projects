<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="header">
            <h1>🎓 STUDENT DASHBOARD</h1>
        </header>

        <!-- Student Information -->
        <section class="student-info">

            <div class="info-box">
                <p>NAME:</p>
                <h2>Anas</h2>
            </div>

            <div class="info-box">
                <p>COURSE:</p>
                <h2>Web Development</h2>
            </div>

        </section>

        <!-- Skills -->
        <section class="skills">

            <div class="skill-card html-card">
                <h2>HTML</h2>
                <p>90%</p>
            </div>

            <div class="skill-card css-card">
                <h2>CSS</h2>
                <p>80%</p>
            </div>

            <div class="skill-card python-card">
                <h2>PYTHON</h2>
                <p>95%</p>
            </div>

        </section>

        <!-- Current Goal -->
        <section class="goal">

            <h2>🎯 Current Goal</h2>

            <div class="goal-box">
                <p>Learn Flexbox</p>
            </div>

        </section>

        <!-- Chat Button -->
        <button class="chat-button">💬</button>

    </div>

</body>
</html>
