<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Station</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="station">

        <header>
            <h1>🚀 SPACE STATION</h1>
            <p>MISSION CONTROL</p>
        </header>

        <section class="systems">

            <div class="system oxygen">
                <h2>🫁 OXYGEN</h2>
                <p>Normal</p>
            </div>

            <div class="system power">
                <h2>⚡ POWER</h2>
                <p>Stable</p>
            </div>

            <div class="system communication">
                <h2>📡 COMMUNICATION</h2>
                <p>Online</p>
            </div>

        </section>

        <section class="mission">

            <h2>🌍 CURRENT MISSION</h2>

            <div class="mission-info">

                <div class="mission-text">
                    <h3>Mars Exploration</h3>
                    <p>Distance: 225 million km</p>
                    <p>Estimated arrival: 7 months</p>
                </div>

                <div class="progress">
                    <div class="progress-bar">
                        64%
                    </div>
                </div>

            </div>

        </section>

        <section class="crew">

            <h2>👨‍🚀 CREW MEMBERS</h2>

            <div class="crew-list">

                <div class="member">
                    <div class="avatar">👨‍🚀</div>
                    <h3>Captain</h3>
                </div>

                <div class="member">
                    <div class="avatar">👩‍🚀</div>
                    <h3>Engineer</h3>
                </div>

                <div class="member">
                    <div class="avatar">👨‍🔬</div>
                    <h3>Scientist</h3>
                </div>

            </div>

        </section>

    </div>

</body>
</html>
